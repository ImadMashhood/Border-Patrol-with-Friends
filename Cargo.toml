[workspace]
members = ["crates/net", "crates/simulation", "crates/scenarios", "crates/caller", "crates/caller-server", "crates/speech", "crates/game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
border-net = { path = "crates/net" }
border-simulation = { path = "crates/simulation" }
border-scenarios = { path = "crates/scenarios" }
border-caller = { path = "crates/caller" }
border-speech = { path = "crates/speech" }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2
